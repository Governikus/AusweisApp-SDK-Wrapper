import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

plugins {
    id("io.github.ben-manes.versions")
    id("org.jetbrains.kotlin.plugin.parcelize") apply false
    id("org.jetbrains.kotlinx.kover")
    id("org.sonarqube")

    id("com.android.application") apply false
}

ext {
    ausweisapp_version = '2.5.5'
    sdkwrapper_version = '2.5.5'
    java_version = 21

    configureRename = { Project module, String suffix ->

        module.tasks.register("renameOutput") {
            dependsOn("assemble")

            doLast {
                def outputDir = module.layout.buildDirectory.dir("outputs/${suffix}").get()
                module.fileTree(outputDir).matching {
                    include("**/*-*.${suffix}")
                    exclude("**/*-*-*.${suffix}")
                }.each { file ->
                    def versionedName = file.name.replace(".${suffix}", "-${sdkwrapper_version}.${suffix}")
                    file.renameTo(new File(file.parent, versionedName))
                }
            }
        }

        module.tasks.named("assemble") {
            finalizedBy("renameOutput")
        }
    }
}

subprojects { subproject ->
    subproject.afterEvaluate {
        tasks.withType(KotlinJvmCompile).configureEach {
            compilerOptions {
                allWarningsAsErrors.set(true)
                freeCompilerArgs.add("-Xstring-concat=inline")
            }
        }
    }
}

sonarqube {
    properties {
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.coverage.jacoco.xmlReportPaths", project.layout.buildDirectory.file("reports/kover/report.xml").get().asFile
    }
}

dependencies {
    kover(project(":sdkwrapper"))
}

allprojects {
    repositories {
        if (System.getenv("MIRROR_GOOGLE_MAVEN")) {
            maven { url = System.getenv("MIRROR_GOOGLE_MAVEN") }
        } else {
            google()
        }
        if (System.getenv("MIRROR_MAVEN")) {
           maven { url = System.getenv("MIRROR_MAVEN") }
        } else {
            mavenCentral()
        }
        maven {
            url = "$project.rootDir/ausweisapp"
        }
    }
}

def isNonStable = { String version ->
    ['alpha', 'beta', 'rc', 'cr', 'm', 'preview', 'b', 'ea', 'dev', 'snapshot'].any { qualifier ->
        version ==~ /(?i).*[.-]${qualifier}[.\d-]*/
    }
}

tasks.named("dependencyUpdates").configure {
    checkForGradleUpdate = false
    outputFormatter = { result ->
        if (!result.outdated.dependencies.isEmpty()) {
            def outdatedLibs = result.outdated.dependencies.collect { dep ->
                " - ${dep.group}:${dep.name} [${dep.version} -> ${dep.available.release ?: dep.available.milestone}]"
            }.join('\n')

            throw new GradleException("Build failed! The following outdated dependencies were found:\n$outdatedLibs")
        } else {
            println "All dependencies are up to date."
        }
    }
    rejectVersionIf { selection ->
        if (selection.candidate.group == "androidx.core" && selection.candidate.module == "core-ktx") {
            if (selection.candidate.version == "1.19.0") {
                return true // Requires compileSdk >36, which we not yet use
            }
        }
        if (selection.candidate.module == "kotlin-build-tools-impl") {
            if (selection.currentVersion == "2.4.0") {
                return true
                // Needed because the 2.4.10 of the Kotlin Gradle Plugin seems to also include 2.4.0 for backwards compatibility.
                // We need to check currentVersion here as there are false positives if only the candidate version gets checked.
            }
        }
        if (isNonStable(selection.candidate.version) && !isNonStable(selection.currentVersion)) {
            return true
        }
        return false
    }
}

tasks.register("tarball", Tar) {
    into ('/') {
        from rootDir
        include '**'
        exclude ('dist', '**/build/**', '.reviewboardrc', '.gradle', '.idea', '**/*.aar', '**/*.apk')
     }

    archiveFileName = "SDKWrapper-Android-Sources.tgz"
    destinationDirectory = file('build/tar')
    compression = Compression.GZIP
}
